name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/mindspace-security-recovery

permissions:
  contents: read

jobs:
  build:
    name: Type check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Summarize dependency advisories
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));'

      - name: Type check
        run: npm run lint

      - name: Build production assets
        run: npm run build
