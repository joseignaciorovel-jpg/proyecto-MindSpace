name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/mindspace-security-recovery

permissions:
  contents: read

jobs:
  build:
    name: Type check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build production assets
        run: npm run build
